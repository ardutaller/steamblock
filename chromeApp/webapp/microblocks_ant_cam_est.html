		<!-- SteamBlock - Google Drive -->
		<style>
			#steamblock-drive-test {
				position: fixed;

			#steamblock-drive-test h3 {

			#steamblock-drive-test button {

			#steamblock-drive-connect {

			}

			#steamblock-drive-refresh,

				color: #4b205d;
			}

			#steamblock-drive-projects {

				max-height: 240px;
				overflow-y: auto;
				border: 1px solid #ddd;
				border-radius: 8px;
				padding: 8px;
				background: #fafafa;
			}

			.steamblock-drive-project {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 8px;
				margin-bottom: 6px;
				background: #fff;
				border: 1px solid #ddd;
				border-radius: 6px;
			}

			.steamblock-drive-project:last-child {
				margin-bottom: 0;
			}

			.steamblock-drive-project-name {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.steamblock-drive-project-open {
				width: auto !important;
				margin: 0 !important;
				padding: 6px 10px !important;
				white-space: nowrap;
			}

			#steamblock-drive-status {
				margin-top: 10px;
				padding: 9px;
				background: #f4f5f6;
				border-radius: 7px;
				font-size: 13px;
				line-height: 1.35;
				white-space: pre-wrap;
			}
		</style>

		<div id="steamblock-drive-test">
			<h3>☁️ SteamBlock Google Drive</h3>

			<button id="steamblock-drive-connect">
				🔐 Conectar Google Drive
			</button>

			<div id="steamblock-drive-projects">
				<div style="color:#666;">
					Conecta Google Drive para ver tus proyectos.
				</div>
			</div>

			<button id="steamblock-drive-refresh">
				🔄 Actualizar proyectos
			</button>

			<button id="steamblock-drive-folder">
				🌐 Abrir carpeta en Google Drive
			</button>

			<button id="steamblock-drive-save">
				💾 Guardar
			</button>

			<button id="steamblock-drive-save-as">
				📝 Guardar como…
			</button>

			<button id="steamblock-drive-close">
				✕ Cerrar
			</button>

			<div id="steamblock-drive-status">
				Comprobando módulo Google Drive...
			</div>
		</div>

		<script>
			(function () {

				const status =
					document.getElementById('steamblock-drive-status');

				const connectButton =
					document.getElementById('steamblock-drive-connect');

				const refreshButton =
					document.getElementById('steamblock-drive-refresh');

				const folderButton =
					document.getElementById('steamblock-drive-folder');

				const saveButton =
					document.getElementById('steamblock-drive-save');

				const saveAsButton =
					document.getElementById('steamblock-drive-save-as');

				const closeButton =
					document.getElementById('steamblock-drive-close');

				const projectsContainer =
					document.getElementById('steamblock-drive-projects');


				function checkModule() {

					if (
						window.SteamBlockGoogleDrive &&
						typeof window.SteamBlockGoogleDrive.connect === 'function' &&
						typeof window.SteamBlockGoogleDrive.listFiles === 'function' &&
						typeof window.SteamBlockGoogleDrive.openFile === 'function' &&
						typeof window.SteamBlockGoogleDrive.updateFile === 'function' &&
						typeof GP_writeFile === 'function'
					) {
						status.textContent =
							'✅ Módulo Google Drive cargado.';
						return true;
					}

					status.textContent =
						'⚠️ El módulo Google Drive todavía no está disponible.';
					return false;
				}


				let currentDriveFile = null;
				let lastProjectFileName = 'Untitled.ubp';
				let pendingProjectSave = null;

				if (!window.__steamBlockDriveOriginalGPWriteFile) {
					window.__steamBlockDriveOriginalGPWriteFile = GP_writeFile;
				}

				GP_writeFile = async function (data, fName, id) {
					if (id === 'project' && pendingProjectSave) {
						const request = pendingProjectSave;
						pendingProjectSave = null;

						try {
							let targetName = request.fileName || fName || 'Untitled.ubp';
							targetName = targetName.split('/').pop();
							if (!targetName.toLowerCase().endsWith('.ubp')) {
								targetName += '.ubp';
							}

							let result;

							if (request.mode === 'save' && currentDriveFile) {
								result = await window.SteamBlockGoogleDrive.updateFile(
									currentDriveFile.id,
									data,
									'application/octet-stream'
								);
							} else {
								const files = await window.SteamBlockGoogleDrive.listFiles();
								const existing = files.find(function (file) {
									return file.name &&
										file.name.toLowerCase() === targetName.toLowerCase();
								});

								if (existing) {
									if (!window.confirm(
										'Ya existe un proyecto llamado "' + targetName + '".\n\n¿Quieres sobrescribirlo?'
									)) {
										request.resolve(false);
										return;
									}

									result = await window.SteamBlockGoogleDrive.updateFile(
										existing.id,
										data,
										'application/octet-stream'
									);
								} else {
									result = await window.SteamBlockGoogleDrive.saveFile(
										targetName,
										data,
										'application/octet-stream'
									);
								}
							}

							currentDriveFile = {
								id: result.id,
								name: result.name || targetName
							};
							lastProjectFileName = currentDriveFile.name;
							request.resolve(currentDriveFile);

						} catch (error) {
							request.reject(error);
						}

						return;
					}

					return window.__steamBlockDriveOriginalGPWriteFile(data, fName, id);
				};

				function requestProjectSave(mode, fileName) {
					return new Promise(function (resolve, reject) {
						if (pendingProjectSave) {
							reject(new Error('Ya hay un guardado en curso.'));
							return;
						}

						pendingProjectSave = {
							mode: mode,
							fileName: fileName,
							resolve: resolve,
							reject: reject
						};

						try {
							GP.apiCall('project.save');
						} catch (error) {
							pendingProjectSave = null;
							reject(error);
						}
					});
				}

				async function loadProjects() {

					if (!checkModule()) return;

					if (!window.SteamBlockGoogleDrive.isConnected()) {
						status.textContent =
							'Primero conecta Google Drive.';
						return;
					}

					try {

						status.textContent =
							'📂 Buscando proyectos en SteamBlock...';

						projectsContainer.innerHTML =
							'<div style="color:#666;">Buscando proyectos...</div>';

						const files =
							await window.SteamBlockGoogleDrive.listFiles();

						const projects =
							files.filter(function (file) {
								return file.name &&
									file.name.toLowerCase().endsWith('.ubp');
							});

						projectsContainer.innerHTML = '';

						if (projects.length === 0) {

							projectsContainer.innerHTML =
								'<div style="color:#666;">' +
								'No hay proyectos .ubp en Google Drive.' +
								'</div>';

							status.textContent =
								'📂 No se encontraron proyectos.';
							return;
						}


						projects.forEach(function (file) {

							const row =
								document.createElement('div');

							row.className =
								'steamblock-drive-project';


							const name =
								document.createElement('div');

							name.className =
								'steamblock-drive-project-name';

							name.textContent =
								'📄 ' + file.name;


							const openButton =
								document.createElement('button');

							openButton.className =
								'steamblock-drive-project-open';

							openButton.textContent =
								'▶ Abrir';


							openButton.addEventListener(
								'click',
								async function () {

									try {

										status.textContent =
											'📥 Descargando "' +
											file.name +
											'"...';

										await window.SteamBlockGoogleDrive.openFile(
											file.id,
											file.name
										);

										currentDriveFile = {
											id: file.id,
											name: file.name
										};
										lastProjectFileName = file.name;

										status.textContent =
											'✅ Proyecto enviado a SteamBlock.\n' +
											'Confirma la apertura si aparece el aviso.';

									} catch (error) {

										status.textContent =
											'❌ Error al abrir el proyecto.\n' +
											error.message;
									}
								}
							);


							row.appendChild(name);
							row.appendChild(openButton);

							projectsContainer.appendChild(row);
						});


						status.textContent =
							'✅ ' +
							projects.length +
							' proyecto(s) encontrado(s).';

					} catch (error) {

						status.textContent =
							'❌ Error al cargar los proyectos.\n' +
							error.message;

						projectsContainer.innerHTML =
							'<div style="color:#c00;">' +
							'No se pudieron cargar los proyectos.' +
							'</div>';
					}
				}


				connectButton.addEventListener(
					'click',
					function () {

						if (!checkModule()) return;

						window.steamBlockGoogleDriveCallback =
							function (type, data) {

								if (type === 'connected') {

									status.textContent =
										'✅ Google Drive conectado correctamente.';

									loadProjects();

								} else if (type === 'error') {

									status.textContent =
										'❌ Error de autorización.\n' +
										(data ? JSON.stringify(data) : '');

								} else if (type === 'disconnected') {

									status.textContent =
										'Google Drive desconectado.';
								}
							};

						status.textContent =
							'🔐 Abriendo autorización de Google...';

						window.SteamBlockGoogleDrive.connect();
					}
				);


				refreshButton.addEventListener(
					'click',
					function () {
						loadProjects();
					}
				);


				folderButton.addEventListener(
					'click',
					async function () {

						if (!checkModule()) return;

						if (!window.SteamBlockGoogleDrive.isConnected()) {
							status.textContent =
								'Primero conecta Google Drive.';
							return;
						}

						try {

							const folder =
								await window.SteamBlockGoogleDrive.getFolder();

							const url =
								'https://drive.google.com/drive/folders/' +
								encodeURIComponent(folder.id);

							window.open(url, '_blank', 'noopener');

							status.textContent =
								'🌐 Abriendo la carpeta SteamBlock en Google Drive.';

						} catch (error) {

							status.textContent =
								'❌ Error al abrir la carpeta.\n' +
								error.message;
						}
					}
				);


				saveButton.addEventListener(
					'click',
					async function () {
						if (!checkModule()) return;
						if (!window.SteamBlockGoogleDrive.isConnected()) {
							status.textContent = 'Primero conecta Google Drive.';
							return;
						}

						try {
							status.textContent = '💾 Guardando proyecto en Google Drive...';
							const result = await requestProjectSave('save', null);

							if (result === false) {
								status.textContent = 'Guardado cancelado.';
								return;
							}

							status.textContent =
								'✅ Proyecto guardado como "' + result.name + '".';
							await loadProjects();

						} catch (error) {
							status.textContent =
								'❌ Error al guardar el proyecto.\n' + error.message;
						}
					}
				);


				saveAsButton.addEventListener(
					'click',
					async function () {
						if (!checkModule()) return;
						if (!window.SteamBlockGoogleDrive.isConnected()) {
							status.textContent = 'Primero conecta Google Drive.';
							return;
						}

						let suggestedName = lastProjectFileName || 'Untitled.ubp';
						if (suggestedName.toLowerCase().endsWith('.ubp')) {
							suggestedName = suggestedName.slice(0, -4);
						}

						const name = window.prompt(
							'Nombre del proyecto:',
							suggestedName
						);

						if (name === null) {
							status.textContent = 'Guardar como cancelado.';
							return;
						}

						const cleanName = name.trim();
						if (!cleanName) {
							status.textContent =
								'❌ Debes indicar un nombre para el proyecto.';
							return;
						}

						try {
							status.textContent =
								'💾 Guardando como "' + cleanName + '"...';

							const result = await requestProjectSave(
								'saveAs',
								cleanName
							);

							if (result === false) {
								status.textContent = 'Guardado cancelado.';
								return;
							}

							status.textContent =
								'✅ Proyecto guardado como "' + result.name + '".';
							await loadProjects();

						} catch (error) {
							status.textContent =
								'❌ Error al guardar como.\n' + error.message;
						}
					}
				);

				closeButton.addEventListener(
					'click',
					function () {

						const panel =
							document.getElementById(
								'steamblock-drive-test'
							);

						if (panel) panel.remove();
					}
				);


				checkModule();
				setTimeout(checkModule, 500);
				setTimeout(checkModule, 1500);

			})();
		</script>
