<!doctype html>
<html lang="en-us">
	<head>
		<title>MicroBlocks</title>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">

		<link rel="manifest" href="manifest.json">
		<link rel="icon" href="favicon.ico" type="image/x-icon" />
		<link rel="apple-touch-icon" href="icons/Bunny512.png">

		<meta name="theme-color" content="white"/>
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<meta name="apple-mobile-web-app-title" content="MicroBlocks">
		<meta name="msapplication-TileImage" content="icons/Bunny192.png">
		<meta name="msapplication-TileColor" content="#FFFFFF">

		<!-- Styles -->
		<link rel="stylesheet" href="styles/config/_config.css">
		<link rel="stylesheet" href="styles/generic/minireset.css">
		<link rel="stylesheet" href="styles/generic/_body.css">
		<link rel="stylesheet" href="styles/components/_app-preloader.css">
		<link rel="stylesheet" href="styles/components/_categories.css">
		<link rel="stylesheet" href="styles/components/_ide.css">
		<link rel="stylesheet" href="styles/components/_scripts-pane-control.css">
		<link rel="stylesheet" href="styles/components/_tips.css">
		<link rel="stylesheet" href="styles/components/_top-bar.css">
		<link rel="stylesheet" href="styles/components/_window.css">
		<link rel="stylesheet" href="styles/components/_wysiwyg.css">
		<link rel="stylesheet" href="styles/utilities/_drag.css">

		<!-- Developer tools. Disable on live instances -->
		<script type="text/javascript" src="devtools.js" defer></script>

		<!-- Localization -->
		<script type="text/javascript" src="gettext.js" defer></script>

		<!-- Window Component -->
		<script type="text/javascript" src="windows.js" defer></script>
	</head>

	<body>


		<!-- Force HTTPS. Otherwise WebSerial can't be accessed. -->
		<script>
			if (location.protocol === 'http:') { location.protocol = 'https:'; }
		</script>


		<!-- Controls -->
		<span id="controls" style="display: none">
			<input type="button" value="Keyboard" id="KeyboardButton">
			<input type="button" value="Backspace" id="BackspaceButton">
			<input type="button" value="Toggle Fullscreen" id="FullscreenButton">
			<input type="button" value="Upload" id="UploadButton">
			<input type="button" value="Enable Microphone" id="EnableMicrophoneButton">
			<input type="button" value="See Inside" id="SeeInsideButton">
			<input type="button" value="Present" id="PresentButton">
			<input type="button" value="Go" id="GoButton">
			<input type="button" value="Stop" id="StopButton">
			<input type="file" id="FileUploader" multiple style="display:none">
		</span>


		<!-- Loader -->
		<div class="app-preloader">
			<div class="app-preloader__big-logo"></div>
			<h1 class="app-preloader__title">Loading...</h1>
		</div>


		<!-- Emcripten -->
		<div class="spinner" id="spinner"></div>
		<div class="emscripten" id="status"></div>
		<div class="emscripten">
			<progress value="0" max="100" id="progress" hidden="1"></progress>
		</div>


		<!-- IDE -->
		<div class="ide">

			<nav class="ide__top">

				<a href="https://microblocks.fun/" target="_blank" class="ide__top-logo" aria-label="MicroBlocks website">
					<img src="img/microblocks-ide-logo.svg" alt="">
				</a>

				<div class="ide__top-menu" data-ide="top-menu"></div>
				<span class="title"></span>
				<div class="buttons-right">
					<div class="progress"></div>
				</div>
				<div class="menu"></div>
			</nav>

			<div class="ide__workspace">

				<div class="ide__workspace-left">
					<div class="categories"></div>
					<span class="lib-header"><l->LIBRARIES</l-></span>
					<nav class="lib-button-holder">
						<a class="round-button" onclick="GP.apiCall('ide.showLibraryDialog');"><l->Add Library</l-></a>
					</nav>
					<div class="libraries"></div>
				</div>

				<div class="emscripten">
					<canvas id="canvas" class="emscripten" width="100px" height="100px"></canvas>
					<div class="scripts-pane-controls --can-drag-through"></div>
				</div>

			</div>

			<div class="ide__bottom">
				<div class="tips">
					<span class="tips__title"></span>
					<span class="tips__content"></span>
				</div>
			</div>

		</div>


		<!-- Functional JS -->
		<script type="text/javascript" src="emModule.js"></script>
		<script type="text/javascript" src="gpSupport.js"></script>
		<script type="text/javascript" src="FileSaver.js"></script>
		<script type="text/javascript" src="gp_wasm.js"></script>


		<!-- IDE -->
		<script type="text/javascript" src="ide.js"></script>
		<script type="text/javascript" src="menus.js"></script>
		<script type="text/javascript" src="buttons.js"></script>
		<script type="text/javascript" src="categories.js"></script>


		<!-- GP Init -->
		<script>
			// emitted by GP (MicroBlocksEditor.gp → openMicroBlocksEditor)
			document.addEventListener('ready', () => { IDE.init(); });
		</script>


	</body>
</html>
