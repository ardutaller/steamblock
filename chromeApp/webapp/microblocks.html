		<!-- SteamBlock - Google Drive -->
		
		<style>
			#steamblock-drive-test {
				position: fixed;
				right: 18px;
				top: 70px;
				z-index: 99999;
				width: 315px;
				max-width: calc(100vw - 20px);
				padding: 0;
				background: #fff;
				border: 2px solid #6b2a86;
				border-radius: 16px;
				box-shadow: 0 8px 28px rgba(47, 26, 58, .22);
				font-family: Arial, sans-serif;
				color: #333;
				overflow: hidden;
				box-sizing: border-box;
				max-height: calc(100vh - 90px);
				transition: opacity .22s ease, transform .22s ease, width .22s ease;
			}

			#steamblock-drive-test *,
			#steamblock-drive-test *::before,
			#steamblock-drive-test *::after {
				box-sizing: border-box;
			}

			/* Mini panel: deliberately kept compact and unchanged in spirit. */
			#steamblock-drive-test.steamblock-drive-collapsed {
				width: 96px;
				height: 58px;
				padding: 0;
				border: 0;
				border-radius: 29px;
				cursor: pointer;
				overflow: visible;
				background: transparent;
				box-shadow: none;
			}

			#steamblock-drive-test.steamblock-drive-collapsed .steamblock-drive-content {
				display: none;
			}

			#steamblock-drive-test.steamblock-drive-collapsed .steamblock-drive-mini {
				display: flex;
			}

			.steamblock-drive-mini {
				display: none;
				width: 96px;
				height: 58px;
				align-items: center;
				justify-content: center;
				gap: 7px;
				padding: 5px 9px;
				background: #fff;
				border: 2px solid #6b2a86;
				border-radius: 29px;
				box-shadow: 0 5px 16px rgba(0,0,0,.22);
				user-select: none;
			}

			.steamblock-drive-mini-robot {
				width: 34px;
				height: 46px;
				object-fit: contain;
			}

			.steamblock-drive-mini-logo {
				width: 29px;
				height: 29px;
				flex: 0 0 auto;
			}

			.steamblock-drive-content {
				display: block;
				max-height: calc(100vh - 172px);
				overflow-y: auto;
				overflow-x: hidden;
				padding-bottom: 4px;
				-webkit-overflow-scrolling: touch;
			}

			.steamblock-drive-content::-webkit-scrollbar {
				width: 8px;
			}
			.steamblock-drive-content::-webkit-scrollbar-thumb {
				background: #cdbbd4;
				border-radius: 8px;
			}
			.steamblock-drive-content::-webkit-scrollbar-track {
				background: #f7f3f8;
			}

			/* Header */
			.steamblock-drive-header {
				display: grid;
				grid-template-columns: 58px 1fr 38px;
				align-items: center;
				column-gap: 8px;
				min-height: 112px;
				padding: 9px 10px;
				background: linear-gradient(135deg, #fbf8fc 0%, #fff 72%);
				border-bottom: 1px solid #eadff0;
			}

			.steamblock-drive-robot {
				display: block;
				width: 58px;
				height: 70px;
				object-fit: contain;
				object-position: center bottom;
				flex: 0 0 auto;
			}

			.steamblock-drive-title {
				min-width: 0;
				text-align: center;
			}

			.steamblock-drive-title-line {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 7px;
			}

			.steamblock-drive-title strong {
				display: block;
				color: #6b2a86;
				font-size: 16px;
				line-height: 1.12;
				letter-spacing: -.2px;
			}

			.steamblock-drive-title-logo {
				width: 27px;
				height: 27px;
				flex: 0 0 auto;
			}

			.steamblock-drive-subtitle {
				display: none;
			}

			.steamblock-drive-header-buttons {
				display: flex;
				justify-content: flex-end;
				align-items: center;
			}

			.steamblock-drive-icon-button {
				width: 31px !important;
				height: 31px;
				margin: 0 !important;
				padding: 0 !important;
				border-radius: 50% !important;
				background: #eee6f1 !important;
				color: #4b205d !important;
				font-size: 18px !important;
				line-height: 1 !important;
				text-align: center !important;
				flex: 0 0 auto;
			}

			/* Language selector: three compact clickable flags inside the header */
			.steamblock-drive-language {
				margin: 5px 0 0;
				display: block;
				width: 100%;
			}

			.steamblock-drive-language-buttons {
				display: flex;
				align-items: stretch;
				width: 100%;
				gap: 4px;
			}

			.steamblock-drive-language-button {
				flex: 1 1 0;
				width: auto !important;
				height: 34px !important;
				min-height: 34px !important;
				margin: 0 !important;
				padding: 2px !important;
				border: 1px solid #d8ccdD !important;
				border-radius: 5px !important;
				background: #fff !important;
				box-shadow: none !important;
				display: flex !important;
				align-items: center !important;
				justify-content: center !important;
				cursor: pointer;
				overflow: hidden;
			}

			.steamblock-drive-language-button:hover {
				transform: none !important;
				box-shadow: 0 2px 5px rgba(65, 35, 78, .12) !important;
			}

			.steamblock-drive-language-button.active {
				border: 2px solid #6b2a86 !important;
				padding: 1px !important;
				box-shadow: none !important;
			}

			.steamblock-drive-language-button img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: fill;
				border-radius: 3px;
			}

			/* Common buttons */
			#steamblock-drive-test button {
				display: flex;
				align-items: center;
				width: calc(100% - 20px);
				min-height: 40px;
				margin: 7px 10px;
				padding: 9px 12px;
				border: 1px solid #e1d5e6;
				border-radius: 9px;
				cursor: pointer;
				font-weight: 600;
				font-size: 14px;
				line-height: 1.2;
				text-align: left;
				transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
			}

			#steamblock-drive-test button:hover {
				filter: brightness(.985);
				transform: translateY(-1px);
				box-shadow: 0 3px 8px rgba(65, 35, 78, .10);
			}

			#steamblock-drive-test button:active {
				transform: translateY(0);
				box-shadow: none;
			}

			#steamblock-drive-connect {
				background: #6b2a86;
				border-color: #6b2a86 !important;
				color: #fff;
				justify-content: center;
				font-size: 14.5px !important;
			}

			#steamblock-drive-refresh,
			#steamblock-drive-folder,
			#steamblock-drive-save,
			#steamblock-drive-save-as {
				background: #f6f1f8;
				color: #4b205d;
			}

			#steamblock-drive-refresh {
				margin-top: 9px;
			}

			#steamblock-drive-save {
				background: #eee6f1;
			}

			#steamblock-drive-save-as {
				background: #fff;
			}

			/* Current project */
			#steamblock-drive-project-info {
				display: none;
				margin: 9px 10px 8px;
				padding: 10px 11px;
				background: #faf7fb;
				border: 1px solid #e6d9eb;
				border-radius: 9px;
			}

			#steamblock-drive-project-info.visible {
				display: block;
			}

			.steamblock-drive-current-name {
				font-weight: 700;
				color: #4b205d;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 13.5px;
			}

			.steamblock-drive-current-source {
				margin-top: 4px;
				color: #777;
				font-size: 11.5px;
				line-height: 1.3;
			}

			/* Drive project list */
			#steamblock-drive-projects {
				margin: 9px 10px 8px;
				max-height: 190px;
				overflow-y: auto;
				border: 1px solid #e3dbe6;
				border-radius: 10px;
				padding: 7px;
				background: #fbfafc;
			}

			.steamblock-drive-project {
				display: flex;
				align-items: center;
				gap: 8px;
				min-height: 40px;
				padding: 7px 8px;
				margin-bottom: 6px;
				background: #fff;
				border: 1px solid #e5e0e7;
				border-radius: 8px;
			}

			.steamblock-drive-project:last-child {
				margin-bottom: 0;
			}

			.steamblock-drive-project-name {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 13px;
			}

			.steamblock-drive-project-open {
				width: auto !important;
				min-height: 32px !important;
				flex: 0 0 auto;
				margin: 0 !important;
				padding: 6px 10px !important;
				white-space: nowrap;
				text-align: center !important;
				background: #eee6f1 !important;
				border-color: #dfd0e5 !important;
				color: #4b205d !important;
			}

			/* Information and status */
			.steamblock-drive-note {
				margin: 8px 10px;
				padding: 8px 10px;
				border-left: 3px solid #6b2a86;
				background: #f8f4fa;
				border-radius: 0 7px 7px 0;
				color: #666;
				font-size: 11.5px;
				line-height: 1.4;
			}

			#steamblock-drive-status {
				margin: 8px 10px 10px;
				padding: 9px 10px;
				background: #f4f5f6;
				border-radius: 8px;
				font-size: 12px;
				line-height: 1.35;
				white-space: pre-wrap;
			}

			/* Credit */
			.steamblock-drive-credit {
				margin-top: 4px;
				padding: 9px 10px 11px;
				border-top: 1px solid #eadff0;
				background: #fcfafd;
				text-align: center;
				font-size: 11px;
				color: #888;
			}

			.steamblock-drive-credit a {
				color: #6b2a86;
				font-weight: 700;
				text-decoration: none;
			}

			.steamblock-drive-credit a:hover {
				text-decoration: underline;
			}

			@media (max-width: 480px) {
				#steamblock-drive-test {
					right: 10px;
					width: min(315px, calc(100vw - 20px));
				}
				.steamblock-drive-header {
					grid-template-columns: 50px 1fr 34px;
					column-gap: 5px;
				}
				.steamblock-drive-robot {
					width: 50px;
					height: 62px;
				}
				.steamblock-drive-title strong {
					font-size: 16px;
				}
				.steamblock-drive-language-button {
					height: 30px !important;
					min-height: 30px !important;
				}
			}

			/* Close is intentionally hidden for now; minimization is the non-destructive exit. */
			#steamblock-drive-close {
				display: none !important;
			}
		</style>

		<script>
			(function () {

				const panel =
					document.getElementById('steamblock-drive-test');

				const status =
					document.getElementById('steamblock-drive-status');

				const connectButton =
					document.getElementById('steamblock-drive-connect');

				const refreshButton =
					document.getElementById('steamblock-drive-refresh');

				const folderButton =
					document.getElementById('steamblock-drive-folder');

				const saveButton =
					document.getElementById('steamblock-drive-save');

				const saveAsButton =
					document.getElementById('steamblock-drive-save-as');

				const minimizeButton =
					document.getElementById('steamblock-drive-minimize');

				const closeButton =
					document.getElementById('steamblock-drive-close');

				const projectsContainer =
					document.getElementById('steamblock-drive-projects');

				const projectInfo =
					document.getElementById('steamblock-drive-project-info');

				const currentName =
					document.getElementById('steamblock-drive-current-name');

				const currentSource =
					document.getElementById('steamblock-drive-current-source');

				const miniButton =
					panel.querySelector('.steamblock-drive-mini');

				const AUTO_MINIMIZE_MS = 10000;
				let minimizeTimer = null;
				let currentDriveFile = null;
				let lastProjectFileName = 'Untitled.ubp';
				let pendingProjectSave = null;

				function showProjectInfo(sourceText) {
					if (!currentDriveFile || !currentDriveFile.name) {
						projectInfo.classList.remove('visible');
						return;
					}

					currentName.textContent = '📄 ' + currentDriveFile.name;
					currentSource.textContent =
						sourceText || 'Copia obtenida de Google Drive';
					projectInfo.classList.add('visible');
				}

				function scheduleMinimize() {
					clearTimeout(minimizeTimer);
					if (panel.classList.contains('steamblock-drive-collapsed')) return;

					minimizeTimer = setTimeout(function () {
						panel.classList.add('steamblock-drive-collapsed');
					}, AUTO_MINIMIZE_MS);
				}

				function expandPanel() {
					panel.classList.remove('steamblock-drive-collapsed');
					scheduleMinimize();
				}

				panel.addEventListener('mouseenter', function () {
					clearTimeout(minimizeTimer);
				});

				panel.addEventListener('mouseleave', function () {
					scheduleMinimize();
				});

				minimizeButton.addEventListener('click', function (event) {
					event.stopPropagation();
					clearTimeout(minimizeTimer);
					panel.classList.add('steamblock-drive-collapsed');
				});

				miniButton.addEventListener('click', function (event) {
					event.stopPropagation();
					expandPanel();
				});

				function checkModule() {

					if (
						window.SteamBlockGoogleDrive &&
						typeof window.SteamBlockGoogleDrive.connect === 'function' &&
						typeof window.SteamBlockGoogleDrive.listFiles === 'function' &&
						typeof window.SteamBlockGoogleDrive.openFile === 'function' &&
						typeof window.SteamBlockGoogleDrive.updateFile === 'function' &&
						typeof GP_writeFile === 'function'
					) {
						status.textContent =
							'✅ Módulo Google Drive cargado.';
						return true;
					}

					status.textContent =
						'⚠️ El módulo Google Drive todavía no está disponible.';
					return false;
				}

				if (!window.__steamBlockDriveOriginalGPWriteFile) {
					window.__steamBlockDriveOriginalGPWriteFile = GP_writeFile;
				}

				GP_writeFile = async function (data, fName, id) {
					if (id === 'project' && pendingProjectSave) {
						const request = pendingProjectSave;
						pendingProjectSave = null;

						try {
							let targetName =
								request.fileName || fName || 'Untitled.ubp';

							targetName = targetName.split('/').pop();

							if (!targetName.toLowerCase().endsWith('.ubp')) {
								targetName += '.ubp';
							}

							let result;

							if (request.mode === 'save' && currentDriveFile) {
								result = await window.SteamBlockGoogleDrive.updateFile(
									currentDriveFile.id,
									data,
									'application/octet-stream'
								);
							} else {
								const files =
									await window.SteamBlockGoogleDrive.listFiles();

								const existing = files.find(function (file) {
									return file.name &&
										file.name.toLowerCase() === targetName.toLowerCase();
								});

								if (existing) {
									if (!window.confirm(
										'Ya existe un proyecto llamado "' +
										targetName +
										'".\n\n¿Quieres sobrescribirlo?'
									)) {
										request.resolve(false);
										return;
									}

									result =
										await window.SteamBlockGoogleDrive.updateFile(
											existing.id,
											data,
											'application/octet-stream'
										);
								} else {
									result =
										await window.SteamBlockGoogleDrive.saveFile(
											targetName,
											data,
											'application/octet-stream'
										);
								}
							}

							currentDriveFile = {
								id: result.id,
								name: result.name || targetName
							};

							lastProjectFileName =
								currentDriveFile.name;

							request.resolve(currentDriveFile);

						} catch (error) {
							request.reject(error);
						}

						return;
					}

					return window.__steamBlockDriveOriginalGPWriteFile(
						data,
						fName,
						id
					);
				};

				function requestProjectSave(mode, fileName) {
					return new Promise(function (resolve, reject) {
						if (pendingProjectSave) {
							reject(
								new Error('Ya hay un guardado en curso.')
							);
							return;
						}

						pendingProjectSave = {
							mode: mode,
							fileName: fileName,
							resolve: resolve,
							reject: reject
						};

						try {
							GP.apiCall('project.save');
						} catch (error) {
							pendingProjectSave = null;
							reject(error);
						}
					});
				}

				async function loadProjects() {

					if (!checkModule()) return;

					if (!window.SteamBlockGoogleDrive.isConnected()) {
						status.textContent =
							'Primero conecta Google Drive.';
						return;
					}

					try {

						status.textContent =
							'📂 Buscando proyectos en SteamBlock...';

						projectsContainer.innerHTML =
							'<div style="color:#666;">Buscando proyectos...</div>';

						const files =
							await window.SteamBlockGoogleDrive.listFiles();

						const projects =
							files.filter(function (file) {
								return file.name &&
									file.name.toLowerCase().endsWith('.ubp');
							});

						projectsContainer.innerHTML = '';

						if (projects.length === 0) {

							projectsContainer.innerHTML =
								'<div style="color:#666;">' +
								'No hay proyectos .ubp en Google Drive.' +
								'</div>';

							status.textContent =
								'📂 No se encontraron proyectos.';
							return;
						}

						projects.forEach(function (file) {

							const row =
								document.createElement('div');

							row.className =
								'steamblock-drive-project';

							const name =
								document.createElement('div');

							name.className =
								'steamblock-drive-project-name';

							name.textContent =
								'📄 ' + file.name;

							const openProjectButton =
								document.createElement('button');

							openProjectButton.className =
								'steamblock-drive-project-open';

							openProjectButton.textContent =
								(languageTexts[language] || languageTexts.es).open;

							openProjectButton.addEventListener(
								'click',
								async function (event) {

									event.stopPropagation();

									try {

										status.textContent =
											'📥 Descargando "' +
											file.name +
											'"...';

										await window.SteamBlockGoogleDrive.openFile(
											file.id,
											file.name
										);

										currentDriveFile = {
											id: file.id,
											name: file.name
										};

										lastProjectFileName =
											file.name;

										showProjectInfo(
											'Copia obtenida de Google Drive'
										);

										status.textContent =
											'✅ Proyecto enviado a SteamBlock.\n' +
											'Confirma la apertura si aparece el aviso.';

									} catch (error) {

										status.textContent =
											'❌ Error al abrir el proyecto.\n' +
											error.message;
									}
								}
							);

							row.appendChild(name);
							row.appendChild(openProjectButton);

							projectsContainer.appendChild(row);
						});

						status.textContent =
							'✅ ' +
							projects.length +
							' proyecto(s) encontrado(s).';

					} catch (error) {

						status.textContent =
							'❌ Error al cargar los proyectos.\n' +
							error.message;

						projectsContainer.innerHTML =
							'<div style="color:#c00;">' +
							'No se pudieron cargar los proyectos.' +
							'</div>';
					}
				}

				connectButton.addEventListener(
					'click',
					function (event) {

						event.stopPropagation();

						if (!checkModule()) return;

						window.steamBlockGoogleDriveCallback =
							function (type, data) {

								if (type === 'connected') {

									status.textContent =
										'✅ Google Drive conectado correctamente.';

									loadProjects();

								} else if (type === 'error') {

									status.textContent =
										'❌ Error de autorización.\n' +
										(data ? JSON.stringify(data) : '');

								} else if (type === 'disconnected') {

									status.textContent =
										'Google Drive desconectado.';
								}
							};

						status.textContent =
							'🔐 Abriendo autorización de Google...';

						window.SteamBlockGoogleDrive.connect();
					}
				);

				refreshButton.addEventListener(
					'click',
					function (event) {
						event.stopPropagation();
						loadProjects();
					}
				);

				folderButton.addEventListener(
					'click',
					async function (event) {

						event.stopPropagation();

						if (!checkModule()) return;

						if (!window.SteamBlockGoogleDrive.isConnected()) {
							status.textContent =
								'Primero conecta Google Drive.';
							return;
						}

						try {

							const folder =
								await window.SteamBlockGoogleDrive.getFolder();

							const url =
								'https://drive.google.com/drive/folders/' +
								encodeURIComponent(folder.id);

							window.open(url, '_blank', 'noopener');

							status.textContent =
								'🌐 Abriendo la carpeta SteamBlock en Google Drive.';

						} catch (error) {

							status.textContent =
								'❌ Error al abrir la carpeta.\n' +
								error.message;
						}
					}
				);

				saveButton.addEventListener(
					'click',
					async function (event) {

						event.stopPropagation();

						if (!checkModule()) return;

						if (!window.SteamBlockGoogleDrive.isConnected()) {
							status.textContent =
								'Primero conecta Google Drive.';
							return;
						}

						try {

							status.textContent =
								'💾 Guardando proyecto en Google Drive...';

							const result =
								await requestProjectSave('save', null);

							if (result === false) {
								status.textContent =
									'Guardado cancelado.';
								return;
							}

							currentDriveFile = {
								id: result.id,
								name: result.name
							};

							lastProjectFileName =
								result.name;

							showProjectInfo(
								'Guardado en Google Drive'
							);

							status.textContent =
								'✅ Proyecto guardado como "' +
								result.name +
								'".';

							await loadProjects();

						} catch (error) {

							status.textContent =
								'❌ Error al guardar el proyecto.\n' +
								error.message;
						}
					}
				);

				saveAsButton.addEventListener(
					'click',
					async function (event) {

						event.stopPropagation();

						if (!checkModule()) return;

						if (!window.SteamBlockGoogleDrive.isConnected()) {
							status.textContent =
								'Primero conecta Google Drive.';
							return;
						}

						let suggestedName =
							lastProjectFileName || 'Untitled.ubp';

						if (
							suggestedName.toLowerCase().endsWith('.ubp')
						) {
							suggestedName =
								suggestedName.slice(0, -4);
						}

						const name = window.prompt(
							'Nombre del proyecto:',
							suggestedName
						);

						if (name === null) {
							status.textContent =
								'Guardar como cancelado.';
							return;
						}

						const cleanName = name.trim();

						if (!cleanName) {
							status.textContent =
								'❌ Debes indicar un nombre para el proyecto.';
							return;
						}

						try {

							status.textContent =
								'💾 Guardando como "' +
								cleanName +
								'"...';

							const result =
								await requestProjectSave(
									'saveAs',
									cleanName
								);

							if (result === false) {
								status.textContent =
									'Guardado cancelado.';
								return;
							}

							currentDriveFile = {
								id: result.id,
								name: result.name
							};

							lastProjectFileName =
								result.name;

							showProjectInfo(
								'Guardado como copia en Google Drive'
							);

							status.textContent =
								'✅ Proyecto guardado como "' +
								result.name +
								'".';

							await loadProjects();

						} catch (error) {

							status.textContent =
								'❌ Error al guardar como.\n' +
								error.message;
						}
					}
				);

				// El botón Cerrar se mantiene oculto. La única forma de
				// retirar temporalmente el panel es minimizarlo.



				const languageButtons =
					panel.querySelectorAll('.steamblock-drive-language-button');

				const languageTexts = {
					es: {
						connect: '🔐 Conectar Google Drive',
						refresh: '🔄 Actualizar proyectos',
						folder: '🌐 Abrir carpeta en Google Drive',
						save: '💾 Guardar',
						saveAs: '📝 Guardar como…',
						note: 'ℹ️ Para guardar cambios usa el bloque <strong>SteamBlock Google Drive</strong>.',
						subtitle: 'Gestor de proyectos',
						placeholder: 'Conecta Google Drive para ver tus proyectos.',
						open: '▶ Abrir',
						language: '🌐 Idioma',
						minimize: 'Minimizar panel',
						show: 'Mostrar SteamBlock Google Drive'
					},
					en: {
						connect: '🔐 Connect Google Drive',
						refresh: '🔄 Refresh projects',
						folder: '🌐 Open folder in Google Drive',
						save: '💾 Save',
						saveAs: '📝 Save as…',
						note: 'ℹ️ To save changes, use the <strong>SteamBlock Google Drive</strong> block.',
						subtitle: 'Project manager',
						placeholder: 'Connect Google Drive to see your projects.',
						open: '▶ Open',
						language: '🌐 Language',
						minimize: 'Minimize panel',
						show: 'Show SteamBlock Google Drive'
					},
					ca: {
						connect: '🔐 Connectar Google Drive',
						refresh: '🔄 Actualitzar projectes',
						folder: '🌐 Obrir carpeta a Google Drive',
						save: '💾 Desar',
						saveAs: '📝 Desar com…',
						note: 'ℹ️ Per desar els canvis, utilitza el bloc <strong>SteamBlock Google Drive</strong>.',
						subtitle: 'Gestor de projectes',
						placeholder: 'Connecta Google Drive per veure els teus projectes.',
						open: '▶ Obrir',
						language: '🌐 Idioma',
						minimize: 'Minimitzar panell',
						show: 'Mostrar SteamBlock Google Drive'
					}
				};

				function applyLanguage(lang) {
					const t = languageTexts[lang] || languageTexts.es;

					languageButtons.forEach(function (button) {
						button.classList.toggle('active', button.dataset.lang === lang);
					});

					connectButton.textContent = t.connect;
					refreshButton.textContent = t.refresh;
					folderButton.textContent = t.folder;
					saveButton.textContent = t.save;
					saveAsButton.textContent = t.saveAs;

					const note = panel.querySelector('.steamblock-drive-note');
					if (note) note.innerHTML = t.note;


					const subtitle = panel.querySelector('.steamblock-drive-subtitle');
					if (subtitle) subtitle.textContent = t.subtitle;

					minimizeButton.title = t.minimize;
					minimizeButton.setAttribute('aria-label', t.minimize);

					if (!projectsContainer.children.length ||
						projectsContainer.textContent.includes('Conecta Google Drive') ||
						projectsContainer.textContent.includes('Connect Google Drive') ||
						projectsContainer.textContent.includes('Connecta Google Drive')) {
						projectsContainer.innerHTML =
							'<div style="color:#666;">' + t.placeholder + '</div>';
					}

					panel.querySelectorAll('.steamblock-drive-project-open').forEach(function (button) {
						button.textContent = t.open;
					});

					miniButton.title = t.show;
					miniButton.setAttribute('aria-label', t.show);

					try {
						localStorage.setItem('steamblock-drive-language', lang);
					} catch (e) {}
				}

				let savedLanguage = 'es';
				try {
					savedLanguage =
						localStorage.getItem('steamblock-drive-language') || 'es';
				} catch (e) {}

				if (!languageTexts[savedLanguage]) savedLanguage = 'es';
				languageButtons.forEach(function (button) {
						button.classList.toggle('active', button.dataset.lang === savedLanguage);
					});
				applyLanguage(savedLanguage);

				languageButtons.forEach(function (button) {
					button.addEventListener('click', function () {
						applyLanguage(this.dataset.lang);
					});
				});

				checkModule();
				setTimeout(checkModule, 500);
				setTimeout(checkModule, 1500);

				scheduleMinimize();

			})();
		</script>

	</body>
</html>
