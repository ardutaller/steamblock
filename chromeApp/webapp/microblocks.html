<!doctype html>
<html lang="en-us">
	<head>
		<title>MicroBlocks</title>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">

		<link rel="manifest" href="manifest.json">
		<link rel="icon" href="favicon.ico" type="image/x-icon" />
		<link rel="apple-touch-icon" href="icons/Bunny512.png">
		<link rel="stylesheet" href="style.css">

		<meta name="theme-color" content="white"/>
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black">
		<meta name="apple-mobile-web-app-title" content="MicroBlocks">
		<meta name="msapplication-TileImage" content="icons/Bunny192.png">
		<meta name="msapplication-TileColor" content="#FFFFFF">

		<!-- Developer tools. Disable on live instances -->
		<script type="text/javascript" src="devtools.js" defer></script>

		<!-- Localization -->
		<script type="text/javascript" src="gettext.js" defer></script>

		<style>
		</style>
	</head>
	<body>
	<script>
		// Force HTTPS. Otherwise WebSerial can't be accessed.
		if (location.protocol === 'http:') { location.protocol = 'https:'; }
	</script>
	<span id='controls' style="display: none">
		<input type="button" value="Keyboard" id="KeyboardButton">
		<input type="button" value="Backspace" id="BackspaceButton">
		<input type="button" value="Toggle Fullscreen" id="FullscreenButton">
		<input type="button" value="Upload" id="UploadButton">
		<input type="button" value="Enable Microphone" id="EnableMicrophoneButton">
		<input type="button" value="See Inside" id="SeeInsideButton">
		<input type="button" value="Present" id="PresentButton">
		<input type="button" value="Go" id="GoButton">
		<input type="button" value="Stop" id="StopButton">
		<input type="file" id="FileUploader" multiple style="display:none">
	</span>

	<div class="loading">
		<div class="big-logo"></div>
		<h1>Loading...</h1>
	</div>

	<div class="spinner" id='spinner'></div>
	<div class="emscripten" id="status"></div>
	<div class="emscripten">
		<progress value="0" max="100" id="progress" hidden=1></progress>
	</div>

	<div class="ide">
		<nav class="top-bar">
			<img src="img/logo.svg" class="logo" aria-label="MicroBlocks"
				aria-description="Rosa, the MicroBlocks bunny, is named after
				Rózsa Péter, a great mathematician.">
			</img>
			<div class="buttons-left"></div>
			<span class="title"></span>
			<div class="buttons-right">
				<div class="progress"></div>
			</div>
			<div class="menu"></div>
		</nav>
		<div class="workspace">
			<div class="left-bar">
				<div class="categories"></div>
				<span class="lib-header"><l->LIBRARIES</l-></span>
				<nav class="lib-button-holder">
					<a class="round-button" onclick="GP.apiCall('ide.showLibraryDialog');"><l->Add Library</l-></a>
				</nav>
				<div class="libraries"></div>
			</div>
			<div class="emscripten">
				<canvas class="emscripten" id="canvas" width="100px" height="100px"></canvas>
				<div class="script-controls can-drag-through"></div>
			</div>
		</div>
		<div class="tip-bar">
			<span class="tip-title"></span>
			<span class="tip-content"></span>
		</div>
	</div>

	<script type="text/javascript" src="emModule.js"></script>
	<script type="text/javascript" src="gpSupport.js"></script>
	<script type="text/javascript" src="FileSaver.js"></script>
	<script type="text/javascript" src="gp_wasm.js"></script>


	<!-- IDE -->
	<script type="text/javascript" src="ide.js"></script>
	<script type="text/javascript" src="menus.js"></script>
	<script type="text/javascript" src="buttons.js"></script>
	<script type="text/javascript" src="categories.js"></script>

	<script>
		// emitted by GP (MicroBlocksEditor.gp → openMicroBlocksEditor)
		document.addEventListener('ready', () => { IDE.init(); });
	</script>

	</body>
</html>
