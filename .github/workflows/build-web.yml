name: Build and Deploy MicroBlocks Web

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      - name: Comprobar Emscripten
        run: emcc --version

      - name: Compilar GP WebAssembly
        run: ./build.sh --gp

      - name: Comprobar archivos generados
        run: |
          ls -lh chromeApp/webapp/gp_wasm.js
          ls -lh chromeApp/webapp/gp_wasm.wasm
          ls -lh chromeApp/webapp/gp_wasm.data

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
