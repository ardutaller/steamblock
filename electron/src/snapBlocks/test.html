<!DOCTYPE html>
<html>
    <head>
        <title>MicroBlocks in Snap</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="morphic.js?version=2025-03-20"></script>
        <script src="symbols.js?version=2024-11-24"></script>
        <script src="widgets.js?version=2025-09-10"></script>
        <script src="mb-blocks.js?version=2025-10-12"></script>
        <script src="mb-gui.js?version=2025-10-12"></script>
        <script src="mb-builtin-blocks.js?version=2025-10-12"></script>
        <script src="mb-parser.js?version=2025-10-12"></script>
        <script>
            var world;
            window.onload = function () {
                var FPS = 60,
                    lastTime = 0,

                    loop = (timestamp) => {
                        requestAnimationFrame(loop);
                        if (timestamp - lastTime < 1000 / FPS) {
                            return;
                        }
                        world.doOneCycle();
                        lastTime = Math.max(
                            lastTime + 1000 / FPS,
                            timestamp - 1000 / FPS
                        );
                    };
                world = new WorldMorph(document.getElementById('world'));
                addMicroBlocksGUI(world);
                requestAnimationFrame(loop);
            };
        </script>
    </head>
    <body style="margin: 0;">
        <canvas id="world" tabindex="1" style="position: absolute;"></canvas>
    </body>
</html>
