<!DOCTYPE html>
<html>
    <head>
        <title>Just Blocks</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="morphic.js?version=2025-03-20"></script>
        <script src="symbols.js?version=2024-11-24"></script>
        <script src="blocks.js?version=2025-06-11"></script>
        <script>
            var world;
            window.onload = function () {
                var FPS = 60,
                    lastTime = 0,

                    loop = (timestamp) => {
                        requestAnimationFrame(loop);
                        if (timestamp - lastTime < 1000 / FPS) {
                            return;
                        }
                        world.doOneCycle();
                        lastTime = Math.max(
                            lastTime + 1000 / FPS,
                            timestamp - 1000 / FPS
                        );
                    };
                world = new WorldMorph(document.getElementById('world'));
                var scripts = new ScriptsMorph();
                scripts.setExtent(new Point(800, 600));
                world.add(scripts);
                b=new CommandBlockMorph(); b.setCategory('motion'); b.setSpec('testing %s'); b.isDraggable=true; world.children[0].add(b)
                b=new CommandBlockMorph(); b.setCategory('looks'); b.setSpec('something else %s'); b.isDraggable=true; world.children[0].add(b)
                b=new ReporterBlockMorph(); b.setCategory('operators'); b.setSpec('report this %s'); b.isDraggable=true; world.children[0].add(b);
                requestAnimationFrame(loop);
            };
        </script>
    </head>
    <body style="margin: 0;">
        <canvas id="world" tabindex="1" style="position: absolute;"></canvas>
    </body>
</html>
