<!DOCTYPE html>
<html>
	<head>
		<title>MicroBlocks in Snap</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script src="morphic.js?version=2025-03-20"></script>
		<script src="mb-blocks.js?version=2025-10-12"></script>
		<script src="mb-files.js?version=2025-12-31"></script>
		<script src="mb-gui.js?version=2025-10-12"></script>
		<script src="mb-specs.js?version=2025-10-21"></script>
		<script src="mb-parser.js?version=2025-10-12"></script>
		<script src="mb-function.js?version=2025-10-12"></script>
		<script src="mb-project.js?version=2025-10-12"></script>
		<script src="mb-compiler.js?version=2026-4-17"></script>
		<script src="mb-code-manager.js?version=2026-4-23"></script>
		<script src="mb-connection.js?version=2026-4-23"></script>
		<script src="mb-comm-port.js?version=2026-4-24"></script>
		<script>
			var world;
			window.onload = function () {
				var FPS = 60,
					lastTime = 0,

					loop = (timestamp) => {
						requestAnimationFrame(loop);
						if (timestamp - lastTime < 1000 / FPS) {
							return;
						}
						world.doOneCycle();
						lastTime = Math.max(
							lastTime + 1000 / FPS,
							timestamp - 1000 / FPS
						);
					};
				world = new WorldMorph(document.getElementById('world'));
				MB_GUI.addMicroBlocksGUI(world);
				requestAnimationFrame(loop);
			};
		</script>
	</head>
	<body style="margin: 0;">
		<canvas id="world" tabindex="1" style="position: absolute;"></canvas>
	</body>
</html>
